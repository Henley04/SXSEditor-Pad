name: Build Android APK and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build webpack frontend
        run: npx webpack --mode production

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

      - name: Extract version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  build-apk:
    name: Build APK (${{ matrix.abi }})
    needs: build-web
    runs-on: ubuntu-latest
    # Job-level env exposes whether the signing keystore secret is present.
    # Step-level `if:` cannot reference the `secrets` context directly
    # (GitHub Actions restricts it — only env/github/inputs/job/matrix/
    # needs/runner/steps/strategy/vars are allowed in `if:`), so we
    # materialise the boolean here and have steps check `env.HAS_SIGNING`.
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `arch` is the short Tauri --target name (the CLI only accepts
          # aarch64 / armv7 / i686 / x86_64 — full triples like
          # aarch64-linux-android are REJECTED).
          # `triple` is the Rust target used by rustup / dtolnay/rust-toolchain.
          # `abi` is the Android ABI folder name used in the output APK path.
          - arch: aarch64
            triple: aarch64-linux-android
            abi: arm64-v8a
          - arch: armv7
            triple: armv7-linux-androideabi
            abi: armeabi-v7a
          - arch: x86_64
            triple: x86_64-linux-android
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # Cache Cargo registry + git + the per-target build artifacts. This is
      # the single biggest win: a clean release LTO build of this crate is
      # ~13 min/job; with a warm cache the incremental build drops to ~2-3 min.
      # Keyed on Cargo.lock so a dependency bump correctly invalidates; the
      # `Cargo.lock` → hash is shared by all 3 per-ABI jobs (same lockfile),
      # so the first job to finish warms the cache for the other two via the
      # shared `-target-` restore-key prefix. Mirrors the tauri-action /
      # Swatinem/rust-cache pattern recommended by the Tauri docs.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Append the ABI so each target gets its own target/ dir in cache.
          key: ${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Gradle wrapper cache — saves the per-job dependency resolution
          # (~30s) and avoids re-downloading gradle distributions.
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi

      - name: Install Android build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Ensure Rust Android target
        run: rustup target add ${{ matrix.triple }}

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci 2>/dev/null || true

      - name: Configure Android release signing
        # Gradle's `release` buildType ships an UNSIGNED apk by default —
        # that is what made every CI-built APK fail to install with
        # "package info is null". Decode the upload keystore (stored as a
        # base64 GitHub secret) to runner temp, write keystore.properties
        # pointing at it, and inject a `signingConfigs { release { ... } }`
        # block into the Tauri-generated app/build.gradle.kts. The patch
        # script is idempotent so re-runs are safe. Secrets are absent on
        # forks/PRs from forks — we guard with `if: env.HAS_SIGNING ==
        # 'true'` (set at job level, since `secrets` is not allowed in
        # step `if:`) so the job degrades to the unsigned build there
        # instead of failing.
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is empty}"
          KEYSTORE="$RUNNER_TEMP/sxseditor-pad.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE"
          cd src-tauri/gen/android
          cat > keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storePassword=${ANDROID_STORE_PASSWORD}
          storeFile=${KEYSTORE}
          EOF
          # The heredoc above is indented for readability; strip the leading
          # whitespace Gradle does not care about, but keep values intact.
          sed -i 's/^[[:space:]]*//' keystore.properties
          echo "keystore.properties written (storeFile=$(grep storeFile keystore.properties | cut -d= -f2-))"
          python3 "$GITHUB_WORKSPACE/scripts/apply-android-signing.py" \
            "app/build.gradle.kts"

      - name: Build per-ABI APK (${{ matrix.abi }})
        # Use the SHORT arch name for --target (full triples are rejected by
        # the Tauri CLI). `--split-per-abi` makes Gradle emit ABI-suffixed
        # APKs (e.g. app-arm64-v8a-release.apk) so we can pick the right one.
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --target ${{ matrix.arch }} --split-per-abi --apk --ci

      - name: Verify APK is installable (badging + signature)
        # Two checks:
        #   1. aapt dump badging  → APK is structurally valid (package info
        #      is parseable, not null).
        #   2. apksigner verify   → APK is actually signed with a release
        #      key. Unsigned release APKs install with "package info is
        #      null" / "there was a problem parsing the package" on device,
        #      which is the failure mode this whole signing setup fixes.
        # Both must pass before the APK is uploaded as an artifact. The
        # signature check only runs when a signing key was configured
        # (fork PRs have no access to the keystore secret → unsigned build,
        # which is expected there and skipped, not failed). HAS_SIGNING is
        # set at job level (see comment there).
        run: |
          set -e
          AAPT=$(find $ANDROID_HOME -name aapt2 -type f 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then AAPT=$(find $ANDROID_HOME -name aapt -type f 2>/dev/null | head -1); fi
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          APK=$(find src-tauri/gen/android -name "*-${{ matrix.abi }}-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced for ${{ matrix.abi }}" >&2
            exit 1
          fi
          echo "Verifying: $APK"
          echo "--- badging ---"
          if [ -n "$AAPT" ]; then
            BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null | head -1 || true)
            echo "badging: $BADGE"
            if ! echo "$BADGE" | grep -q "package:"; then
              echo "ERROR: APK is not parseable (package info is null)" >&2
              exit 1
            fi
            # Surface the key package info for the build log: package name,
            # version code/name, label, icon, launchable activity, SDK.
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -iE "^package:|^application-label:|^launchable-activity:|^sdkVersion:|^targetSdkVersion:" || true
          else
            echo "aapt not found, skipping badging verification"
          fi
          echo "--- signature ---"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "signing not configured (no keystore secret) — skipping signature check"
          elif [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skipping signature verification"
          else
            if ! "$APKSIGNER" verify --print-certs "$APK" >/dev/null 2>&1; then
              echo "ERROR: APK signature verification failed — APK is UNSIGNED or the signature is invalid" >&2
              echo "       (this is what causes 'package info is null' on install)" >&2
              exit 1
            fi
            echo "apksigner: OK (APK is signed)"
            "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -iE "^Signer #1 certificate|SHA-256|subject:" || true
          fi

      - name: Locate APK (per-arch)
        id: apk
        run: |
          set -e
          # Prefer ABI-suffixed APK; fall back to any release APK.
          APK_PATH=$(find src-tauri/gen/android -name "*-${{ matrix.abi }}-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No APK found for ${{ matrix.abi }}" >&2
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "SXSEditor-Pad-${{ matrix.abi }}.apk"
          echo "path=SXSEditor-Pad-${{ matrix.abi }}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXSEditor-Pad-${{ matrix.abi }}.apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  build-universal:
    name: Build Universal APK (all architectures)
    needs: build-web
    runs-on: ubuntu-latest
    # See the build-apk job for why HAS_SIGNING lives at job level.
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Same Cargo cache as the per-ABI jobs (see comment there). The
      # universal job builds all 3 ABIs in one run, so the cache key is
      # suffixed `universal` to keep its multi-target build artifacts separate
      # from the per-ABI ones (each target/ dir holds one ABI's artifacts).
      # Restore keys fall back to the per-ABI caches so a prior per-ABI run
      # can warm this job.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi

      - name: Install Android build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Ensure all Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci 2>/dev/null || true

      - name: Configure Android release signing
        # Same signing setup as the per-ABI job (see comment there). The
        # universal APK is what we recommend users install, so it MUST be
        # signed by the upload key.
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is empty}"
          KEYSTORE="$RUNNER_TEMP/sxseditor-pad.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$KEYSTORE"
          cd src-tauri/gen/android
          cat > keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storePassword=${ANDROID_STORE_PASSWORD}
          storeFile=${KEYSTORE}
          EOF
          sed -i 's/^[[:space:]]*//' keystore.properties
          echo "keystore.properties written (storeFile=$(grep storeFile keystore.properties | cut -d= -f2-))"
          python3 "$GITHUB_WORKSPACE/scripts/apply-android-signing.py" \
            "app/build.gradle.kts"

      - name: Build Universal APK (all architectures)
        # Omit --target entirely so Tauri builds ALL Android targets (the
        # default). Omit --split-per-abi so Gradle emits a SINGLE universal
        # APK bundling every ABI — this is what fixes the "package info is
        # null" install error (previously an ABI-incompatible split APK was
        # shipped as "universal"). `all` is NOT a valid --target value.
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --apk --ci

      - name: Verify Universal APK is installable (badging + signature)
        # See the per-ABI verify step for rationale. Both badging + apksigner
        # must pass before the universal APK is uploaded. HAS_SIGNING comes
        # from the job-level env.
        run: |
          set -e
          AAPT=$(find $ANDROID_HOME -name aapt2 -type f 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then AAPT=$(find $ANDROID_HOME -name aapt -type f 2>/dev/null | head -1); fi
          APKSIGNER=$(find $ANDROID_HOME -name apksigner -type f 2>/dev/null | head -1)
          APK=$(find src-tauri/gen/android -name "*-universal-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: no universal APK produced" >&2
            exit 1
          fi
          echo "Verifying: $APK"
          echo "--- badging ---"
          if [ -n "$AAPT" ]; then
            BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null | head -1 || true)
            echo "badging: $BADGE"
            if ! echo "$BADGE" | grep -q "package:"; then
              echo "ERROR: universal APK is not parseable (package info is null)" >&2
              exit 1
            fi
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -iE "^package:|^application-label:|^launchable-activity:|^sdkVersion:|^targetSdkVersion:" || true
          else
            echo "aapt not found, skipping badging verification"
          fi
          echo "--- signature ---"
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "signing not configured (no keystore secret) — skipping signature check"
          elif [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, skipping signature verification"
          else
            if ! "$APKSIGNER" verify --print-certs "$APK" >/dev/null 2>&1; then
              echo "ERROR: universal APK signature verification failed — UNSIGNED or invalid signature" >&2
              exit 1
            fi
            echo "apksigner: OK (universal APK is signed)"
            "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -iE "^Signer #1 certificate|SHA-256|subject:" || true
          fi

      - name: Locate Universal APK
        id: apk
        run: |
          set -e
          # Gradle "universal" APK → fallback to app-release.apk → any release APK.
          APK_PATH=$(find src-tauri/gen/android -name "*-universal-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -name "app-release.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -name "*release*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "No universal APK found" >&2
            exit 1
          fi
          echo "Found Universal APK: $APK_PATH"
          cp "$APK_PATH" "SXSEditor-Pad-universal.apk"
          echo "path=SXSEditor-Pad-universal.apk" >> $GITHUB_OUTPUT

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXSEditor-Pad-universal.apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-web, build-apk, build-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: SXSEditor-Pad-*.apk
          path: apks/
          merge-multiple: true

      - name: Normalize APK filenames
        run: |
          set -e
          mkdir -p release-assets
          ls -la apks/ || true
          for f in apks/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *universal*)         cp -f "$f" release-assets/SXSEditor-Pad-universal.apk ;;
              *arm64-v8a*|*arm64*) cp -f "$f" release-assets/SXSEditor-Pad-arm64-v8a.apk ;;
              *armeabi-v7a*|*armv7*) cp -f "$f" release-assets/SXSEditor-Pad-armeabi-v7a.apk ;;
              *x86_64*)            cp -f "$f" release-assets/SXSEditor-Pad-x86_64.apk ;;
              *)                   cp -f "$f" release-assets/"$base" ;;
            esac
          done
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: SXSEditor-Pad ${{ needs.build-web.outputs.version }}
          body: |
            ## SXSEditor-Pad ${{ needs.build-web.outputs.version }}

            AI Singing Voice Synthesis Workstation for mobile devices.

            ### Downloads
            - **universal** (recommended — works on all Android devices)
            - **arm64-v8a** (for modern ARM64 tablets/phones)
            - **armeabi-v7a** (for older 32-bit ARM devices)
            - **x86_64** (for Android emulators and x86 tablets)

            ### Changelog
            See the [commits](https://github.com/Henley04/SXSEditor-Pad/commits/master) for detailed changes.
          artifacts: "release-assets/*.apk"
          makeLatest: true
          generateReleaseNotes: true
