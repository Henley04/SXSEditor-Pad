name: Build Android APK and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build webpack frontend
        run: npx webpack --mode production

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

      - name: Extract version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  build-apk:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv7, x86_64]
        include:
          - arch: aarch64
            abi: arm64-v8a
          - arch: armv7
            abi: armeabi-v7a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Android targets for Rust
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Initialize Tauri Android project
        run: |
          npx tauri android init --ci 2>/dev/null || true

      - name: Build Android APK (${{ matrix.abi }})
        run: |
          npx tauri android build --target ${{ matrix.arch }} --apk --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXSEditor-Pad-${{ matrix.abi }}.apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  build-universal:
    name: Build Universal APK (all architectures)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME 2>/dev/null || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/*/ 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Android targets for Rust
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Initialize Tauri Android project
        run: |
          npx tauri android init --ci 2>/dev/null || true

      - name: Build Universal APK (all architectures)
        run: |
          npx tauri android build --apk --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate Universal APK
        id: apk
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f | head -1)
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SXSEditor-Pad-universal.apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-web, build-apk, build-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: SXSEditor-Pad-*.apk
          path: apks/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: SXSEditor-Pad ${{ needs.build-web.outputs.version }}
          body: |
            ## SXSEditor-Pad ${{ needs.build-web.outputs.version }}

            AI Singing Voice Synthesis Workstation for mobile devices.

            ### Downloads
            - **universal** (recommended — works on all Android devices)
            - **arm64-v8a** (for modern ARM64 tablets/phones)
            - **armeabi-v7a** (for older 32-bit ARM devices)
            - **x86_64** (for Android emulators and x86 tablets)

            ### Changelog
            See the [commits](https://github.com/Henley04/SXSEditor-Pad/commits/master) for detailed changes.
          artifacts: "apks/*.apk"
          makeLatest: true
          generateReleaseNotes: true