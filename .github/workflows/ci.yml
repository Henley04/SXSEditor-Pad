name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test-build:
    name: Lint + Test + Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ESLint
        run: npx eslint src test --ext .js || true
      - name: Run tests
        run: npx mocha --require ./test/setup.js "test/**/*.test.js" --timeout 30000 --reporter spec
      - name: Build
        run: npx vite build

  rust-check:
    name: Rust Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check || true
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
