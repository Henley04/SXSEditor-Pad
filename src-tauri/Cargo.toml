[package]
name = "sxseditor-pad"
version = "1.0.0"
description = "SXSEditor-Pad - AI Singing Voice Synthesis Workstation for Mobile Devices"
authors = ["SXSEditor Dev"]
edition = "2021"

[lib]
name = "sxseditor_pad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP downloads of model files from ModelScope.
# rustls-tls avoids native OpenSSL on Android/iOS; `stream` enables chunked
# download progress reporting back to the renderer.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }
futures-util = "0.3"
# Native ONNX Runtime inference. `load-dynamic` loads libonnxruntime at
# runtime (ORT Mobile .so on Android, .xcframework on iOS, system lib on
# desktop) so the crate compiles and tests without the native library present.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "half"] }
half = "2"
# Dynamic loading for libtensorflowlite_c (Basic Pitch / LiteRT).
libloading = "0.8"
# WAV export for synthesized audio.
hound = "3"
# SHA-256 model integrity checks.
sha2 = "0.10"
# Base64 tensor-frame transport (Android IPC fallback path).
base64 = "0.22"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
