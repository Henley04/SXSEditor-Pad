[package]
name = "sxseditor-pad"
version = "1.0.0"
description = "SXSEditor-Pad - AI歌声合成工作台 (移动端Pad版)"
authors = ["SXSEditor Dev"]
edition = "2021"

[lib]
name = "sxseditor_pad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"